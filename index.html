<!doctype html>
<html lang="en" data-theme="tglight">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Secret Santa</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Right theme before first paint; theme.js repeats this logic (mirroredPref + resolveTheme).
      try {
        var p = localStorage.getItem('theme');
        var s = (window.Telegram && Telegram.WebApp && Telegram.WebApp.colorScheme) || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = p === 'christmas' ? 'christmas' : (p === 'light' || p === 'dark' ? p : s) === 'dark' ? 'tgdark' : 'tglight';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
